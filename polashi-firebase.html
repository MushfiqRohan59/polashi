<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>পলাশী — অনলাইন সংস্করণ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#10182B;
    --navy-deep:#0A0F1E;
    --parchment:#EDE1C8;
    --parchment-dim:#E1D3B0;
    --ink:#2A2117;
    --gold:#C9A227;
    --gold-bright:#E4C158;
    --nawab:#2F5233;
    --nawab-bright:#4A7A50;
    --eic:#7A2E2E;
    --eic-bright:#A83E3E;
    --line:rgba(201,162,39,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #16213E 0%, var(--navy) 45%, var(--navy-deep) 100%);
    min-height:100vh;
    font-family:'Noto Sans Bengali','Cinzel',serif;
    color:var(--parchment);
    display:flex; justify-content:center;
  }
  #app{ width:100%; max-width:540px; min-height:100vh; position:relative; display:flex; flex-direction:column; padding:20px 16px 40px;}
  .bg-lines{ position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:38px 38px; opacity:0.35;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
  }
  h1,h2,h3{ font-family:'Tiro Bangla', serif; letter-spacing:0.01em; margin:0 0 6px; font-weight:700;}
  .eyebrow{ font-family:'Cinzel', serif; font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); margin-bottom:8px;}
  .title-block{ text-align:center; margin:8px 0 24px; position:relative; z-index:1;}
  .title-block h1{ font-size:32px; color:var(--parchment);}
  .title-block .sub{ font-size:16px; color:var(--gold-bright); font-family:'Noto Sans Bengali',serif;}
  .card{ background:var(--parchment); color:var(--ink); border-radius:4px; padding:20px 18px; box-shadow:0 12px 30px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(42,33,23,0.08); position:relative; z-index:1; margin-bottom:14px;}
  .card::before{ content:""; position:absolute; inset:6px; border:1px solid rgba(42,33,23,0.15); pointer-events:none;}
  .card h2{ color:var(--ink); font-size:21px;}
  .card p{ line-height:1.6; font-size:16px; margin:8px 0;}
  label{ display:block; font-size:13px; letter-spacing:0.04em; color:#5a4d38; margin:14px 0 6px; font-family:'Noto Sans Bengali',serif; font-weight:600;}
  input[type=text]{ width:100%; padding:11px 12px; border-radius:3px; border:1px solid rgba(42,33,23,0.3); background:#F7F0DE; font-family:'Noto Sans Bengali',serif; font-size:17px; color:var(--ink);}
  input:focus{ outline:2px solid var(--gold);}
  .btn{ font-family:'Noto Sans Bengali',serif; font-weight:700; letter-spacing:0.01em; font-size:15px; padding:13px 18px; border-radius:3px; border:none; cursor:pointer; width:100%; margin-top:12px; touch-action:manipulation; transition:transform .12s ease, filter .12s ease, opacity .12s ease;}
  .btn:active{ transform:scale(0.96); filter:brightness(0.92);}
  .btn-gold{ background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:var(--navy-deep); box-shadow:0 4px 12px rgba(201,162,39,0.35);}
  .btn-nawab{ background:linear-gradient(180deg, var(--nawab-bright), var(--nawab)); color:#EDF3EA;}
  .btn-eic{ background:linear-gradient(180deg, var(--eic-bright), var(--eic)); color:#F5E7E7;}
  .btn-outline{ background:transparent; border:1px solid rgba(42,33,23,0.35); color:var(--ink);}
  .btn:disabled{ opacity:0.4; cursor:not-allowed;}
  .btn:disabled.is-loading{ opacity:0.75; cursor:progress;}
  .btn-spin{ display:inline-block; width:12px; height:12px; margin-right:6px; vertical-align:-1px; border:2px solid currentColor; border-right-color:transparent; border-bottom-color:transparent; border-radius:50%; opacity:0.85; animation:spin 0.6s linear infinite;}
  .btn-row{ display:flex; gap:10px;}
  .btn-row .btn{ margin-top:0;}
  .code-display{ text-align:center; font-family:'Cinzel',serif; font-size:38px; letter-spacing:0.25em; color:var(--gold); background:rgba(201,162,39,0.08); border:1px dashed var(--gold); border-radius:6px; padding:16px; margin:12px 0;}
  .note-box{ background:rgba(201,162,39,0.08); border:1px solid var(--line); border-radius:4px; padding:12px 14px; font-size:13.5px; color:#6b5220; margin:12px 0; line-height:1.55;}
  .roster{ margin-top:6px;}
  .roster-item{ display:flex; justify-content:space-between; align-items:center; padding:9px 4px; border-bottom:1px solid rgba(42,33,23,0.12); font-size:16px;}
  .pill{ font-size:11px; padding:3px 9px; border-radius:10px; font-family:'Noto Sans Bengali',serif; font-weight:700;}
  .pill.wait{ background:#e6dcc0; color:#7a6a45;}
  .pill.ready{ background:var(--nawab); color:#EDF3EA;}
  .progress-bar{ display:flex; justify-content:center; gap:8px; margin-bottom:14px; position:relative; z-index:1;}
  .map-card{ width:38px; height:48px; border-radius:2px; border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-size:11px; color:var(--gold); background:rgba(255,255,255,0.03); text-align:center; line-height:1.2;}
  .map-card.won-nawab{ background:var(--nawab); border-color:var(--nawab-bright); color:#EDF3EA;}
  .map-card.won-eic{ background:var(--eic); border-color:var(--eic-bright); color:#F5E7E7;}
  .map-card.current{ box-shadow:0 0 0 3px rgba(201,162,39,0.4);}
  .scoreline{ text-align:center; font-size:13.5px; color:var(--gold-bright); margin-bottom:14px; font-family:'Noto Sans Bengali',serif;}
  .seal-wrap{ display:flex; justify-content:center; margin:22px 0 8px;}
  .seal{ width:150px; height:150px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; background:radial-gradient(circle at 35% 30%, #d8c894, var(--gold) 55%, #8a6d15 100%); box-shadow:0 10px 26px rgba(0,0,0,0.5), inset 0 0 0 6px rgba(0,0,0,0.15); position:relative; transition:transform 0.2s cubic-bezier(.2,.9,.3,1.3); transform-style:preserve-3d; touch-action:manipulation;}

  .seal-front{ color:var(--navy-deep); font-size:14px;}

  .result-banner{ text-align:center; padding:16px; border-radius:4px; margin:12px 0; font-family:'Tiro Bangla',serif; font-size:18px;}

  .waiting-box{ text-align:center; padding:22px 10px;}

  @keyframes spin{ to{ transform:rotate(360deg);} }

  .tag.nawab{ background:var(--nawab); color:#EDF3EA;}
  .tag.eic{ background:var(--eic); color:#F5E7E7;}
  .footer-note{ text-align:center; font-size:12px; color:rgba(237,225,200,0.5); margin-top:18px; line-height:1.5; position:relative; z-index:1;}
  .host-badge{ display:inline-block; background:var(--gold); color:var(--navy-deep); font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.1em; padding:3px 8px; border-radius:3px; margin-bottom:10px;}
  .btn-ghost{ background:rgba(228,193,88,0.1); border:1.5px solid var(--gold); color:var(--gold-bright);}
  .corner-bar{ display:flex; justify-content:flex-end; margin-bottom:6px; position:relative; z-index:1;}
  .corner-link{ font-family:'Noto Sans Bengali',serif; font-size:12px; background:none; border:none; cursor:pointer; padding:4px 8px; text-decoration:underline; touch-action:manipulation; color:rgba(237,225,200,0.65);}
  .corner-link.danger{ color:#e2938f;}
  .corner-link:active{ opacity:0.65;}
  .rulebook-back{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--gold-bright); font-family:'Noto Sans Bengali',serif; font-size:14px; font-weight:700; cursor:pointer; padding:6px 0; margin-bottom:8px; touch-action:manipulation;}
  .rulebook-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 14px;}
  .rulebook-tab{ flex:1 1 auto; min-width:64px; padding:9px 6px; border-radius:20px; border:1.5px solid rgba(42,33,23,0.3); background:#F7F0DE; font-family:'Noto Sans Bengali',serif; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink); text-align:center; touch-action:manipulation; transition:transform .12s ease, filter .12s ease;}
  .rulebook-tab.active{ background:var(--gold); border-color:var(--gold); color:var(--navy-deep); font-weight:700;}
  .rulebook-tab:active{ transform:scale(0.96);}
  .rulebook-section h3{ font-size:17px; margin:18px 0 6px; color:var(--ink);}
  .rulebook-section h3:first-child{ margin-top:0;}
  .rulebook-section p{ line-height:1.65;}
  .char-group-label{ font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8a6d15; margin:16px 0 6px;}
  .char-card-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 12px;}
  .char-card{ border-radius:6px; overflow:hidden; border:1.5px solid rgba(42,33,23,0.15); background:#F7F0DE; box-shadow:0 3px 8px rgba(0,0,0,0.12); display:flex; flex-direction:column;}
  .char-card-portrait{ height:40px; display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-size:20px; color:rgba(255,255,255,0.85);}
  .char-card-portrait.nawab{ background:radial-gradient(circle, var(--nawab-bright), var(--nawab) 80%);}
  .char-card-portrait.eic{ background:radial-gradient(circle, var(--eic-bright), var(--eic) 80%);}
  .char-card-banner{ padding:8px 10px 6px; font-family:'Tiro Bangla',serif; font-size:14.5px; font-weight:700; color:#fff;}
  .char-card-banner.nawab{ background:linear-gradient(180deg, var(--nawab-bright), var(--nawab));}
  .char-card-banner.eic{ background:linear-gradient(180deg, var(--eic-bright), var(--eic));}
  .char-card-meta{ display:block; font-family:'Noto Sans Bengali',serif; font-size:10px; font-weight:600; opacity:0.85; margin-top:2px;}
  .char-card-body{ padding:9px 10px 11px; font-size:12.5px; line-height:1.55; color:var(--ink); flex:1;}
  .rulebook-table{ width:100%; border-collapse:collapse; margin:12px 0; font-size:13px;}
  .rulebook-table th, .rulebook-table td{ border:1px solid rgba(42,33,23,0.15); padding:6px 4px; text-align:center;}
  .rulebook-table th{ background:rgba(42,33,23,0.06); font-weight:700; font-size:11px;}
  .rulebook-table td.row-nawab{ background:rgba(47,82,51,0.14); color:var(--nawab); font-weight:700;}
  .rulebook-table td.row-eic{ background:rgba(122,46,46,0.14); color:var(--eic); font-weight:700;}
  .rulebook-table th.row-label{ background:rgba(42,33,23,0.06); font-weight:700; text-align:right; font-size:11px;}
  .rulebook-note{ background:rgba(201,162,39,0.12); border-left:3px solid var(--gold); border-radius:0 4px 4px 0; padding:10px 12px; font-size:13px; color:#6b5220; margin:12px 0; line-height:1.55;}
  .step-list{ margin:10px 0; padding-left:0; list-style:none; counter-reset:step;}
  .step-list li{ counter-increment:step; position:relative; padding:8px 0 8px 34px; font-size:14.5px; line-height:1.55; border-bottom:1px solid rgba(42,33,23,0.1);}
  .step-list li:last-child{ border-bottom:none;}
  .step-list li::before{ content:counter(step); position:absolute; left:0; top:8px; width:24px; height:24px; border-radius:50%; background:var(--gold); color:var(--navy-deep); font-family:'Cinzel',serif; font-weight:700; font-size:12.5px; display:flex; align-items:center; justify-content:center;}
  .team-box{ border-radius:4px; padding:12px 14px; font-size:13.5px; line-height:1.55; margin:12px 0;}
  .team-box.nawab{ background:rgba(47,82,51,0.1); border-left:4px solid var(--nawab);}
  .team-box.eic{ background:rgba(122,46,46,0.1); border-left:4px solid var(--eic);}
  .team-box strong{ display:block; margin-bottom:4px; font-size:14.5px;}
</style>
</head>
<body>
<div class="bg-lines"></div>
<div id="app"></div>

<script>
// iOS Safari only applies :active styles to elements while a touch listener
// exists somewhere in the ancestor chain -- without this, tap feedback on
// .btn/.chip/.seal silently never fires on iPhone.
document.addEventListener('touchstart', function(){}, {passive:true});

/* ============ VARIABLE 5-10 PLAYER ROLE SET (confirmed against physical rulebook) ============ */
const ROLE_DEFS = {
  mirmodon:     {bn:'মীর মদন', team:'nawab'},
  mirjafar:     {bn:'মীর জাফর', team:'eic'},
  sirajuddaula: {bn:'নবাব সিরাজউদ্দৌলা', team:'nawab'},
  lutfunnesa:   {bn:'লুৎফুন্নেসা বেগম', team:'nawab'},
  ghaseti:      {bn:'ঘসেটি বেগম', team:'eic'},
  mohonlal:     {bn:'মোহন লাল', team:'nawab'},
  raydurlov:    {bn:'রায় দুর্লভ', team:'eic'},
  saintfrais:   {bn:'সেইন্ট ফ্রে', team:'nawab'},
  nawabextra:   {bn:'নবাব-পক্ষের অতিরিক্ত সৈনিক', team:'nawab'},
  eicextra:     {bn:'EIC-পক্ষের অতিরিক্ত সৈনিক', team:'eic'},
};
// Role pool for a given player count, per the confirmed rulebook table.
function getRoleIdsForCount(numPlayers){
  const ids = ['mirmodon','mirjafar','sirajuddaula','lutfunnesa','ghaseti'];
  if(numPlayers >= 6) ids.push('mohonlal');
  if(numPlayers >= 7) ids.push('raydurlov');
  if(numPlayers >= 8) ids.push('saintfrais');
  if(numPlayers >= 9) ids.push('nawabextra');
  if(numPlayers >= 10) ids.push('eicextra');
  return ids;
}
const TEAM_SIZES_BY_COUNT = {
  5:  [2,3,2,3,3],
  6:  [2,3,4,3,4],
  7:  [2,3,3,4,4],
  8:  [3,4,4,5,6],
  9:  [3,4,4,5,6],
  10: [3,4,4,5,6],
};
const DEFAULT_NUM_PLAYERS = 5;
function teamSizesFor(numPlayers){
  return TEAM_SIZES_BY_COUNT[numPlayers] || TEAM_SIZES_BY_COUNT[DEFAULT_NUM_PLAYERS];
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function randomCode(){
  return String(Math.floor(1000 + Math.random()*9000));
}
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

/* ============ STORAGE HELPERS (shared across all devices via same room code) ============ */
const sleep = (ms) => new Promise(r=>setTimeout(r, ms));
let lastStorageError = null;

// Retries transient storage failures (e.g. "Unexpected response type") with
// short backoff before giving up. Most real hiccups clear within 1-2 retries.
async function withRetry(fn, attempts=4, baseDelay=350){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{
      return await fn();
    }catch(e){
      lastErr = e;
      if(i < attempts-1) await sleep(baseDelay * Math.pow(1.6, i));
    }
  }
  throw lastErr;
}

// Firebase Realtime Database REST API — replaces Claude artifact's window.storage
// so this game can run as a normal hosted webpage (e.g. GitHub Pages) instead of
// only inside Claude.ai. Rooms are stored at {FIREBASE_DB_URL}/rooms/{code}.json
const FIREBASE_DB_URL = 'https://polashi-game-default-rtdb.asia-southeast1.firebasedatabase.app';

// Collapses any accidental duplicate player entries (same name) down to one,
// keeping the first. Belt-and-suspenders alongside addPlayerIdempotent below.
function dedupePlayers(players){
  const seen = new Set();
  return (players||[]).filter(p=>{
    if(seen.has(p.name)) return false;
    seen.add(p.name);
    return true;
  });
}
// Adds a player only if no one with that name is already present and there's
// a free seat -- so calling this twice for the same name (e.g. a refresh /
// rejoin) is a no-op the second time, instead of appending a duplicate.
function addPlayerIdempotent(players, name, numPlayers){
  const list = dedupePlayers(players);
  if(list.find(p=>p.name===name)) return list;
  if(list.length >= numPlayers) return list;
  return [...list, {name}];
}
// Drops any dict keys that don't belong to a name in allowedNames.
function pruneKeys(dict, allowedNames){
  const allowed = new Set(allowedNames);
  const out = {};
  for(const k in (dict||{})){ if(allowed.has(k)) out[k] = dict[k]; }
  return out;
}

// Firebase silently drops empty arrays/objects on write instead of storing them,
// so a field that was [] or {} at save time comes back as `undefined` on read.
// Patch the shape back in right here so every caller can keep assuming
// room.players is an array and room.game.* has its normal type.
function normalizeRoom(room){
  if(!room) return room;
  room.players = dedupePlayers(room.players || []);
  const g = room.game = room.game || {};
  g.numPlayers = g.numPlayers || DEFAULT_NUM_PLAYERS;
  g.playersOrder = g.playersOrder || [];
  g.roles = g.roles || {};
  g.readyReveal = g.readyReveal || {};
  g.selectedTeam = g.selectedTeam || [];
  g.votes = g.votes || {};
  g.missionCards = g.missionCards || {};
  g.chapterResults = g.chapterResults || [];
  // Safety net: ready/vote/mission entries should only ever reference players
  // still in the room. Prune anything stale left behind by a missed reset or
  // a rejoin-under-a-different-name edge case, so these counts can never
  // exceed room.players.length no matter how they got out of sync.
  const knownNames = room.players.map(p=>p.name);
  g.readyReveal = pruneKeys(g.readyReveal, knownNames);
  g.votes = pruneKeys(g.votes, knownNames);
  g.missionCards = pruneKeys(g.missionCards, knownNames);
  return room;
}

async function loadRoom(code){
  try{
    const res = await withRetry(async ()=>{
      const resp = await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`);
      if(!resp.ok) throw new Error('Firebase GET failed: HTTP ' + resp.status);
      return resp.json(); // null if the path doesn't exist yet -- not an error
    });
    lastStorageError = null;
    return normalizeRoom(res) || null;
  }catch(e){
    lastStorageError = (e && e.message) ? e.message : String(e);
    console.error('load failed', e);
    return null;
  }
}
async function saveRoom(code, obj){
  try{
    await withRetry(async ()=>{
      const resp = await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(obj),
      });
      if(!resp.ok) throw new Error('Firebase PUT failed: HTTP ' + resp.status);
    });
    lastStorageError = null;
    return true;
  }catch(e){
    lastStorageError = (e && e.message) ? e.message : String(e);
    console.error('save failed', e);
    return false;
  }
}
// Same as loadRoom but also asks Firebase for the current ETag of the data,
// which mutateRoom uses to make its write conditional (see saveRoomIfMatch
// below). Firebase RTDB's REST API supports true atomic compare-and-swap
// this way -- a conditional PUT is rejected with HTTP 412 if the data
// changed since this ETag was issued -- so two overlapping mutateRoom calls
// can never silently clobber one another; the loser gets a clean 'conflict'
// instead and retries against the winner's result.
async function loadRoomWithETag(code){
  try{
    const res = await withRetry(async ()=>{
      const resp = await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, {
        headers: {'X-Firebase-ETag':'true'},
      });
      if(!resp.ok) throw new Error('Firebase GET failed: HTTP ' + resp.status);
      const etag = resp.headers.get('ETag');
      const body = await resp.json();
      return {body, etag};
    });
    lastStorageError = null;
    return {room: normalizeRoom(res.body) || null, etag: res.etag};
  }catch(e){
    lastStorageError = (e && e.message) ? e.message : String(e);
    console.error('load failed', e);
    return {room: null, etag: null};
  }
}
// Conditional write: only applies if the room's ETag still matches what was
// read (i.e. nobody else has written since). Returns 'ok', 'conflict'
// (someone else wrote first -- caller should re-read and retry the whole
// read-modify-write cycle), or 'error' (network/other failure, already
// recorded in lastStorageError).
async function saveRoomIfMatch(code, obj, etag){
  try{
    const resp = await withRetry(async ()=>{
      const r = await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json', 'if-match': etag},
        body: JSON.stringify(obj),
      });
      // 412 means we lost the race -- that's a signal for mutateRoom to
      // re-read and retry, not a transient failure to retry here as-is.
      if(r.status === 412) return r;
      if(!r.ok) throw new Error('Firebase PUT failed: HTTP ' + r.status);
      return r;
    });
    lastStorageError = null;
    return resp.status === 412 ? 'conflict' : 'ok';
  }catch(e){
    lastStorageError = (e && e.message) ? e.message : String(e);
    console.error('save failed', e);
    return 'error';
  }
}
// Read-modify-write helper with true optimistic concurrency: the write is
// conditional on Firebase's ETag for the room, so if another mutateRoom call
// wrote in between our read and our write, ours is rejected instead of
// silently overwriting theirs -- we just re-read the latest room and retry
// the mutator against it. Combined with the phase-transition guards the
// phase-changing mutators include (e.g. "only advance if still in the
// expected phase"), a losing/duplicate call becomes a harmless no-op instead
// of corrupting state -- this closes the race that previously let two
// racing "reveal results / advance to next chapter" taps both apply and
// silently drop one chapter's outcome.
async function mutateRoom(code, mutator, attempts=6){
  for(let i=0;i<attempts;i++){
    const {room: fresh, etag} = await loadRoomWithETag(code);
    if(!fresh) return null;
    const updated = mutator(fresh) || fresh;
    const result = await saveRoomIfMatch(code, updated, etag);
    if(result === 'ok'){
      // Update the acting client's own view immediately instead of making it
      // wait up to one poll interval to see the effect of its own action.
      if(client.roomCode === code){
        client.room = updated;
        client._lastRoomJSON = JSON.stringify(updated);
        render();
      }
      return updated;
    }
    if(result === 'conflict'){
      await sleep(60 + Math.random()*120);
      continue; // someone else wrote first -- re-read the latest room and retry
    }
    return null; // network/other failure
  }
  return null; // exhausted retries -- extremely unlikely under normal contention
}

async function deleteRoom(code){
  try{
    await withRetry(async ()=>{
      const resp = await fetch(`${FIREBASE_DB_URL}/rooms/${code}.json`, { method: 'DELETE' });
      if(!resp.ok) throw new Error('Firebase DELETE failed: HTTP ' + resp.status);
    });
    lastStorageError = null;
    return true;
  }catch(e){
    lastStorageError = (e && e.message) ? e.message : String(e);
    console.error('delete failed', e);
    return false;
  }
}

/* ============ SESSION PERSISTENCE (localStorage, survives reloads) ============ */
const SESSION_KEY = 'polashi_session';
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      roomCode: client.roomCode,
      myName: client.myName,
      role: client.role,
    }));
  }catch(e){ /* localStorage unavailable (private mode etc) -- session just won't persist */ }
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

// Runs a mutateRoom-backed action for a .btn click: disables the button and
// swaps in a spinner the instant it's tapped, so there's never a dead gap
// while the Firebase write is in flight. On success mutateRoom's own render()
// replaces this button entirely (no-op restore below); on failure/error we
// put the button back so the player can retry.
async function submitAction(btn, action){
  if(btn.disabled) return;
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.classList.add('is-loading');
  btn.innerHTML = `<span class="btn-spin"></span>${btn.dataset.loadingLabel || '…'}`;
  let result;
  try{
    result = await action();
  }catch(e){
    result = null;
  }
  if(result === null && document.body.contains(btn)){
    btn.disabled = false;
    btn.classList.remove('is-loading');
    btn.innerHTML = original;
  }
}

// Same idea as submitAction but for a .chip in a selection grid (endgame
// guess): dims the other chips, marks the tapped one as busy, and restores
// the whole grid on failure so the player can pick again.
async function submitChipAction(chip, allChips, action){
  if(chip.dataset.loading) return;
  const original = chip.textContent;
  allChips.forEach(c=>{ c.style.pointerEvents='none'; c.style.opacity = (c===chip ? '1' : '0.45'); });
  chip.dataset.loading = '1';
  chip.textContent = original + ' …';
  let result;
  try{
    result = await action();
  }catch(e){
    result = null;
  }
  if(result === null && document.body.contains(chip)){
    allChips.forEach(c=>{ c.style.pointerEvents=''; c.style.opacity=''; delete c.dataset.loading; });
    chip.textContent = original;
  }
}

/* ============ APP / CLIENT STATE (local only, not shared) ============ */
const client = {
  role: null,       // null | 'host' | 'player'
  roomCode: null,
  myName: null,
  room: null,        // {players:[], game:{...}} cached from last poll
  pollTimer: null,
  roomClosed: false, // true once a poll confirms the host deleted the room
};

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(client._showRulebook && !client.roomClosed){
    app.appendChild(SCREENS.rulebook());
  } else {
    app.appendChild(SCREENS.landing_or_active());
  }
}

function startPolling(){
  if(client.pollTimer) clearInterval(client.pollTimer);
  const tick = async ()=>{
    const room = await loadRoom(client.roomCode);
    // A successful fetch (no storage error) that returns null means the room
    // genuinely no longer exists -- most commonly the host closed it. Distinct
    // from a transient network hiccup, which also returns null but leaves
    // lastStorageError set; that case falls through to the branch below and
    // keeps showing the last known state instead.
    if(room === null && !lastStorageError){
      clearSession();
      client.roomClosed = true;
      if(client.pollTimer){ clearInterval(client.pollTimer); client.pollTimer = null; }
      client._lastRoomJSON = null;
      render();
      return;
    }
    // Don't blank out a screen we already had just because one poll hiccuped —
    // keep showing the last known state and surface a small connection notice instead.
    if(room !== null || !client.room){
      client.room = room;
    }
    // Skip the render entirely when this poll returned data identical to
    // what's already on screen. render() does app.innerHTML='' and rebuilds
    // every node from scratch, and used to run on every ~1.1s tick
    // regardless of whether anything actually changed -- if a tap landed on
    // a button at the same moment a tick fired, the node under the user's
    // finger got destroyed and rebuilt mid-click and the tap was silently
    // lost, which read as buttons randomly needing a second press.
    const roomJSON = JSON.stringify(client.room);
    const errorChanged = lastStorageError !== client._lastErrorSnapshot;
    const shouldRender = client._forceNextRender || roomJSON !== client._lastRoomJSON || errorChanged;
    client._lastRoomJSON = roomJSON;
    client._lastErrorSnapshot = lastStorageError;
    client._forceNextRender = false;
    if(shouldRender) render();
  };
  tick();
  client.pollTimer = setInterval(tick, 1100);
}

// Mobile browsers throttle or fully pause setInterval once a tab is
// backgrounded or the screen locks, so the poll loop above can silently stop
// firing during a long real-world discussion break and not resume on its
// own -- the host's screen then goes stale until a manual refresh. The
// moment the page becomes visible again, force one immediate fetch + render
// (bypassing the no-op skip above, since neither the DOM nor the timer's
// state should be trusted after an arbitrarily long background period even
// if the data happens to look unchanged) and defensively restart the
// interval rather than assuming it survived.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible') return;
  if(!client.roomCode || client.roomClosed) return;
  client._forceNextRender = true;
  startPolling();
});

// Fully local reset back to the landing screen: stops polling, wipes client
// state and the persisted session, and re-renders. Used by leave/close-room
// and the "room closed" screen's back button.
function resetClientToLanding(){
  if(client.pollTimer){ clearInterval(client.pollTimer); client.pollTimer = null; }
  client.role = null;
  client.roomCode = null;
  client.myName = null;
  client.room = null;
  client.roomClosed = false;
  client._lastRoomJSON = null;
  client._lastErrorSnapshot = null;
  client._forceNextRender = false;
  clearSession();
  render();
}

function rulebookCharsHTML(){

  let html = `<div class="rulebook-section"><h3>চরিত্র পরিচিতি</h3>`;
  groups.forEach(g=>{
    html += `<div class="char-group-label">${g.label}</div><div class="char-card-grid">`;

  });
  html += `</div>`;
  return html;
}

/* ============ LANDING ============ */
const SCREENS = {};

SCREENS.rulebook = function(){
  const wrap = el('div');
  wrap.appendChild(el('div','title-block',
    `<div class="eyebrow">Bengal, 1757</div><h1>পলাশী</h1><div class="sub">খেলার নিয়মাবলী</div>`));
  const card = el('div','card');
  const backBtn = el('button','rulebook-back','← ফিরে যান');
  backBtn.onclick = ()=>{ client._showRulebook = false; render(); };
  card.appendChild(backBtn);

  const activeTab = client._rulebookTab || RULEBOOK_TABS[0].id;
  const tabs = el('div','rulebook-tabs');
  RULEBOOK_TABS.forEach(t=>{
    const tabBtn = el('div','rulebook-tab'+(activeTab===t.id?' active':''), t.label);
    tabBtn.onclick = ()=>{ client._rulebookTab = t.id; render(); };
    tabs.appendChild(tabBtn);
  });
  card.appendChild(tabs);

  const contentMap = {
    intro: rulebookIntroHTML,
    chars: rulebookCharsHTML,
    counts: rulebookCountsHTML,
    flow: rulebookFlowHTML,
    end: rulebookEndHTML,
  };
  const content = el('div');
  content.innerHTML = contentMap[activeTab]();
  card.appendChild(content);

  wrap.appendChild(card);
  return wrap;
};

SCREENS.roomClosed = function(){
  const wrap = el('div');
  wrap.appendChild(el('div','title-block',
    `<div class="eyebrow">Bengal, 1757</div><h1>পলাশী</h1>`));
  const card = el('div','card');
  card.appendChild(el('div','result-banner eic','এই রুমটি হোস্ট বন্ধ করে দিয়েছেন।'));
  const btn = el('button','btn btn-gold','প্রথম পাতায় ফিরে যান');
  btn.onclick = ()=> resetClientToLanding();
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
};

SCREENS.landing_or_active = function(){
  if(client.roomClosed){
    return SCREENS.roomClosed();
  }
  if(client.role === 'host' || client.role === 'player'){
    return SCREENS.gameScreen();
  }
  return SCREENS.landing();
};

     <div class="sub">অনলাইন সংস্করণ — একসাথে অনেক ফোনে খেলুন</div>`));

  card.appendChild(el('label','খেলোয়াড় সংখ্যা (৫–১০ জন)'));
  const countGrid = el('div','chip-grid');
  [5,6,7,8,9,10].forEach(n=>{
    const chip = el('div','chip'+(client._numPlayers===n?' selected':''), String(n));
    chip.onclick = ()=>{ client._numPlayers = n; render(); };
    countGrid.appendChild(chip);
  });
  card.appendChild(countGrid);
  const hostBtn = el('button','btn btn-gold','রুম তৈরি করুন');
  hostBtn.disabled = !client._numPlayers;
  const hostStatus = el('div','note-box');
  hostStatus.style.display='none';
  hostBtn.onclick = async ()=>{
    if(!client._numPlayers) return;
    hostBtn.disabled = true;
    hostBtn.classList.add('is-loading');
    hostBtn.innerHTML = '<span class="btn-spin"></span>তৈরি করা হচ্ছে...';
    hostStatus.style.display='none';
    const code = randomCode();
    const ok = await saveRoom(code, {players:[], game: freshGame(client._numPlayers)});
    if(!ok){
      hostBtn.disabled = false;
      hostBtn.classList.remove('is-loading');
      hostBtn.textContent = 'রুম তৈরি করুন';
      hostStatus.style.display='block';
      hostStatus.innerHTML = `<strong>রুম তৈরি করা যায়নি।</strong> সংযোগ সমস্যা হতে পারে (${lastStorageError || 'অজানা কারণ'})। আবার চেষ্টা করুন।`;
      return;
    }
    client.role = 'host';
    client.roomCode = code;
    saveSession();
    startPolling();
  };
  card.appendChild(hostBtn);
  card.appendChild(hostStatus);
  wrap.appendChild(card);

  const card2 = el('div','card');
  card2.appendChild(el('h2','গেমে যোগ দিন'));
  card2.appendChild(el('p','আপনার নাম ও অ্যাডমিনের দেওয়া ৪-সংখ্যার কোড লিখুন।'));
  const nameInput = document.createElement('input');
  nameInput.type='text'; nameInput.placeholder='আপনার নাম';
  card2.appendChild(el('label','আপনার নাম'));
  card2.appendChild(nameInput);
  const codeInput = document.createElement('input');
  codeInput.type='text'; codeInput.placeholder='যেমনঃ 4821'; codeInput.maxLength=4;
  card2.appendChild(el('label','রুম কোড'));
  card2.appendChild(codeInput);
  const joinBtn = el('button','btn btn-nawab','যোগ দিন');
  const joinStatus = el('div','note-box');
  joinStatus.style.display='none';
  const showJoinError = (msg)=>{
    joinBtn.disabled = false;
    joinBtn.classList.remove('is-loading');
    joinBtn.textContent = 'যোগ দিন';
    joinStatus.style.display='block';
    joinStatus.innerHTML = msg;
  };
  joinBtn.onclick = async ()=>{
    const name = nameInput.value.trim();
    const code = codeInput.value.trim();
    joinStatus.style.display='none';
    if(!name || !code){ showJoinError('নাম ও কোড দুটোই দিন।'); return; }
    joinBtn.disabled = true;
    joinBtn.classList.add('is-loading');
    joinBtn.innerHTML = '<span class="btn-spin"></span>যোগ দেওয়া হচ্ছে...';
    const room = await loadRoom(code);
    if(!room){
      showJoinError(`<strong>এই কোডে কোনো রুম পাওয়া যায়নি।</strong> কোড ঠিক আছে কিনা দেখুন, অথবা সংযোগ সমস্যা হতে পারে (${lastStorageError || 'কোড ভুল হতে পারে'})।`);
      return;
    }
    if(room.players.find(p=>p.name===name)){
      // already joined (e.g. reconnect) -- just resume
      client.role='player'; client.roomCode=code; client.myName=name;
      saveSession();
      startPolling();
      return;
    }
    if(room.players.length >= room.game.numPlayers){ showJoinError(`রুম পূর্ণ (${room.game.numPlayers} জন) — আর কেউ যোগ দিতে পারবে না।`); return; }
    const updated = await mutateRoom(code, (r)=>{
      r.players = addPlayerIdempotent(r.players, name, r.game.numPlayers);
      return r;
    });
    if(!updated){
      showJoinError(`<strong>যোগ দেওয়া যায়নি।</strong> সংযোগ সমস্যা হতে পারে (${lastStorageError || 'অজানা কারণ'})। আবার চেষ্টা করুন।`);
      return;
    }
    client.role='player'; client.roomCode=code; client.myName=name;
    saveSession();
    startPolling();
  };
  card2.appendChild(joinBtn);
  card2.appendChild(joinStatus);
  wrap.appendChild(card2);

  wrap.appendChild(el('div','footer-note','Fan-made digital aid for Polashi by Playground Inc. অফিসিয়াল পণ্য নয়।'));
  return wrap;
};

/* ============ GAME SCREEN ROUTER ============ */
// Persistent leave/close-room controls shown across every phase of an active game.
function gameCornerBar(){
  const bar = el('div','corner-bar');
  if(client.role==='player'){
    const leaveBtn = el('button','corner-link danger','রুম ত্যাগ করুন');
    leaveBtn.onclick = ()=>{
      if(!confirm('আপনি কি নিশ্চিত রুম ত্যাগ করতে চান?')) return;
      resetClientToLanding();
    };
    bar.appendChild(leaveBtn);
  } else if(client.role==='host'){
    const closeBtn = el('button','corner-link danger','রুম বন্ধ করুন');
    closeBtn.onclick = ()=>{
      if(!confirm('এটি রুমটি সম্পূর্ণভাবে বন্ধ করে দেবে এবং সব খেলোয়াড় বিচ্ছিন্ন হয়ে যাবে। নিশ্চিত?')) return;
      submitAction(closeBtn, async ()=>{
        const ok = await deleteRoom(client.roomCode);
        if(!ok) return null;
        resetClientToLanding();
        return true;
      });
    };
    bar.appendChild(closeBtn);
  }
  return bar;
}

SCREENS.gameScreen = function(){
  const room = client.room;
  const wrap = el('div');
  if(client.role==='host') wrap.appendChild(el('div','host-badge','অ্যাডমিন প্যানেল'));
  wrap.appendChild(gameCornerBar());
  const banner = connectionBanner();
  if(banner) wrap.appendChild(banner);

  if(!room){
    const card = el('div','card');
    card.appendChild(el('div','waiting-box','<div class="spinner"></div><p>রুমের সাথে সংযোগ করা হচ্ছে...</p>'));
    wrap.appendChild(card);
    return wrap;
  }

  const game = room.game;
  wrap.appendChild(el('div','title-block', `<div class="eyebrow">রুম কোড: ${client.roomCode}</div><h1>পলাশী</h1>`));

  if(game.phase === 'lobby') wrap.appendChild(PHASE.lobby(room));
  else if(game.phase === 'reveal') wrap.appendChild(PHASE.reveal(room));
  else {
    wrap.appendChild(chapterHeader(game));
    if(game.phase === 'propose') wrap.appendChild(PHASE.propose(room));
    else if(game.phase === 'vote') wrap.appendChild(PHASE.vote(room));
    else if(game.phase === 'mission') wrap.appendChild(PHASE.mission(room));
    else if(game.phase === 'chapterResult') wrap.appendChild(PHASE.chapterResult(room));
    else if(game.phase === 'endgameGuess') wrap.appendChild(PHASE.endgameGuess(room));
    else if(game.phase === 'gameOver') wrap.appendChild(PHASE.gameOver(room));
  }
  return wrap;
};

function chapterHeader(game){
  const sizes = teamSizesFor(game.numPlayers);
  const bar = el('div','progress-bar');
  for(let i=0;i<5;i++){
    let cls='map-card';
    if(game.chapterResults[i]==='nawab') cls+=' won-nawab';
    if(game.chapterResults[i]==='eic') cls+=' won-eic';
    if(i===game.chapterIdx && game.phase!=='gameOver') cls+=' current';
    bar.appendChild(el('div',cls, `${i+1}<br>${sizes[i]}জন`));
  }
  const wins={nawab:0,eic:0};
  game.chapterResults.forEach(r=>wins[r]++);
  const holder = el('div');
  holder.appendChild(bar);
  holder.appendChild(el('div','scoreline', `নবাব পক্ষ ${wins.nawab} — ${wins.eic} EIC পক্ষ   ·   টানা ব্যর্থ দল গঠন: ${game.rejectCount}/5`));
  return holder;
}

const PHASE = {};

/* ---------------- LOBBY ---------------- */
PHASE.lobby = function(room){
  const wrap = el('div');
  const card = el('div','card');
  card.appendChild(el('h2','অপেক্ষাগৃহ (Lobby)'));
  if(client.role==='host'){
    card.appendChild(el('p', `সবাইকে রুম কোড দিন: `));
    card.appendChild(el('div','code-display', client.roomCode));
  } else {
    card.appendChild(el('p', `স্বাগতম, ${client.myName}। বাকি খেলোয়াড়দের জন্য অপেক্ষা করা হচ্ছে...`));
  }
  const roster = el('div','roster');
  room.players.forEach(p=>{
    const row = el('div','roster-item');
    row.innerHTML = `<span>${p.name}</span><span class="pill ready">যোগ দিয়েছেন</span>`;
    roster.appendChild(row);
  });
  const numPlayers = room.game.numPlayers;
  for(let i=room.players.length;i<numPlayers;i++){
    const row = el('div','roster-item');
    row.innerHTML = `<span style="opacity:0.5">অপেক্ষমান আসন</span><span class="pill wait">খালি</span>`;
    roster.appendChild(row);
  }
  card.appendChild(roster);

  if(client.role==='host'){
    const rulebookBtn = el('button','btn btn-outline','খেলার নিয়ম দেখুন');
    rulebookBtn.onclick = ()=>{ client._showRulebook = true; client._rulebookTab = null; render(); };
    card.appendChild(rulebookBtn);
    const roleIds = getRoleIdsForCount(numPlayers);
    const nawabNames = roleIds.filter(id=>ROLE_DEFS[id].team==='nawab').map(id=>ROLE_DEFS[id].bn);
    const eicNames = roleIds.filter(id=>ROLE_DEFS[id].team==='eic').map(id=>ROLE_DEFS[id].bn);
    const note = el('div','note-box', `এই খেলাটি ${numPlayers} জন খেলোয়াড়ের জন্য, বাস্তব রুলবুকে নিশ্চিত করা ভূমিকা বণ্টন অনুযায়ী: <strong>নবাব পক্ষ (${nawabNames.length})</strong> — ${nawabNames.join(', ')}। <strong>EIC পক্ষ (${eicNames.length})</strong> — ${eicNames.join(', ')}।`);
    card.appendChild(note);
    const btn = el('button','btn btn-gold', `ভূমিকা বণ্টন করে খেলা শুরু করুন (${room.players.length}/${numPlayers})`);
    btn.disabled = room.players.length !== numPlayers;
    btn.onclick = ()=> submitAction(btn, ()=>{
      return mutateRoom(client.roomCode, (r)=>{
        if(r.game.phase !== 'lobby') return r; // already dealt by a racing/duplicate tap -- no-op
        const n = r.game.numPlayers || DEFAULT_NUM_PLAYERS;
        const roleList = shuffle(getRoleIdsForCount(n).map(id=>({team:ROLE_DEFS[id].team, roleId:id, bn:ROLE_DEFS[id].bn})));
        const order = shuffle(r.players.map(p=>p.name));
        const roles = {};
        order.forEach((name,i)=>{ roles[name] = roleList[i]; });
        r.game = freshGame(n);
        r.game.playersOrder = order;
        r.game.roles = roles;
        r.game.phase = 'reveal';
        return r;
      });
    });
    card.appendChild(btn);
  }
  wrap.appendChild(card);
  return wrap;
};

/* ---------------- REVEAL ---------------- */
PHASE.reveal = function(room){
  const game = room.game;
  const wrap = el('div');
  const card = el('div','card');

  if(client.role==='host'){
    const readyCount = Math.min(Object.keys(game.readyReveal||{}).length, room.players.length, game.numPlayers);
    card.appendChild(el('h2','ভূমিকা দেখা হচ্ছে'));
    card.appendChild(el('p','প্রত্যেক খেলোয়াড় তার নিজের ফোনে গোপনে ভূমিকা দেখছেন।'));
    const roster = el('div','roster');
    game.playersOrder.forEach(name=>{
      const isReady = !!(game.readyReveal && game.readyReveal[name]);
      const row = el('div','roster-item');
      row.innerHTML = `<span>${name}</span><span class="pill ${isReady?'ready':'wait'}">${isReady?'প্রস্তুত':'দেখছেন...'}</span>`;
      roster.appendChild(row);
    });
    card.appendChild(roster);
    const btn = el('button','btn btn-gold', `অধ্যায় ১ শুরু করুন (${readyCount}/${game.numPlayers})`);
    btn.disabled = readyCount !== game.numPlayers;
    btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
      if(r.game.phase !== 'reveal') return r; // already advanced by a racing/duplicate tap -- no-op
      r.game.phase='propose';
      return r;
    }));
    card.appendChild(btn);
    wrap.appendChild(card);
    return wrap;
  }

  // player view
  const myRole = game.roles[client.myName];
  if(!myRole || !myRole.team){
    console.error('PHASE.reveal: missing role/team for player', client.myName, 'roles=', game.roles);
    card.appendChild(el('div','note-box', `<strong>ত্রুটি:</strong> আপনার ভূমিকা খুঁজে পাওয়া যায়নি (${client.myName})। পাতাটি রিফ্রেশ করুন অথবা হোস্টকে জানান।`));
    wrap.appendChild(card);
    return wrap;
  }
  const alreadyReady = game.readyReveal && game.readyReveal[client.myName];

  if(alreadyReady){
    card.appendChild(el('div','waiting-box','<div class="spinner"></div><p>বাকি সবাই ভূমিকা দেখার অপেক্ষায়...</p>'));
    wrap.appendChild(card);
    return wrap;
  }

  card.appendChild(el('h2', 'আপনার ভূমিকা, ' + client.myName));
  const localFlipped = client._sealFlipped;
  if(!localFlipped){
    const sealWrap = el('div','seal-wrap','<div class="seal" id="sealEl"><div class="seal-face seal-front">সীলমোহরে<br>ট্যাপ করুন</div></div>');
    card.appendChild(sealWrap);
    setTimeout(()=>{
      const s = document.getElementById('sealEl');
      if(s) s.onclick = ()=>{ client._sealFlipped = true; render(); };
    },0);
  } else {
    const teamClass = myRole.team==='nawab' ? 'nawab-seal' : 'eic-seal';
    const teamLabel = myRole.team==='nawab' ? 'নবাব পক্ষ' : 'EIC পক্ষ';
    const sealWrap = el('div','seal-wrap');
    sealWrap.innerHTML = `<div class="seal flipped"><div class="seal-face seal-back ${teamClass}">
        <div class="char-name">${myRole.bn}</div><div class="team-name">${teamLabel}</div></div></div>`;
    card.appendChild(sealWrap);
    card.appendChild(el('p', myRole.team==='nawab'
      ? 'আপনি নবাবের প্রতি অনুগত। আপনি জানেন না আপনার সহযোগীরা কারা। লক্ষ্যঃ ৫টির মধ্যে ৩টি অধ্যায় জেতা।'
      : 'আপনি গোপনে EIC-র পক্ষে। ধরা না পড়ে অধ্যায়গুলো ব্যর্থ করে দিন।'));
    if(myRole.team==='eic'){
      const others = game.playersOrder.filter(n=> n!==client.myName && game.roles[n].team==='eic');
      const box = el('div','note-box');
      box.innerHTML = '<strong>আপনার সহযোগী EIC এজেন্ট:</strong><br>' + others.map(n=>`${n} — <em>${game.roles[n].bn}</em>`).join('<br>');
      card.appendChild(box);
    } else if(myRole.team==='nawab' && myRole.roleId==='mirmodon'){
      // Ray Durlov's card is hidden from Mir Modon's detection -- exclude him if present.
      const eicMembers = game.playersOrder.filter(n=> game.roles[n].team==='eic' && game.roles[n].roleId!=='raydurlov');
      const box = el('div','note-box');
      box.innerHTML = '<strong>আপনি জানেন এরা EIC পক্ষে আছে:</strong><br>' + eicMembers.map(n=>`${n} — <em>${game.roles[n].bn}</em>`).join('<br>');
      card.appendChild(box);
    } else if(myRole.team==='nawab' && myRole.roleId==='mohonlal'){
      const mirModonName = game.playersOrder.find(n=> game.roles[n].roleId==='mirmodon');
      const ghasetiName = game.playersOrder.find(n=> game.roles[n].roleId==='ghaseti');
      const candidates = shuffle([mirModonName, ghasetiName].filter(Boolean));
      const box = el('div','note-box');
      box.innerHTML = '<strong>এদের মধ্যে একজন মীর মদন:</strong><br>' + candidates.join('<br>');
      card.appendChild(box);
    }
    const btn = el('button','btn btn-outline','মনে রেখেছি — প্রস্তুত');
    btn.onclick = ()=> submitAction(btn, async ()=>{
      const result = await mutateRoom(client.roomCode, (r)=>{
        r.game.readyReveal = r.game.readyReveal || {};
        r.game.readyReveal[client.myName] = true;
        return r;
      });
      client._sealFlipped = false;
      return result;
    });
    card.appendChild(btn);
  }
  wrap.appendChild(card);
  return wrap;
};

/* ---------------- PROPOSE ---------------- */
PHASE.propose = function(room){
  const game = room.game;
  const wrap = el('div');
  const card = el('div','card');
  const proposer = game.playersOrder[game.proposerIdx];
  const teamSize = teamSizesFor(game.numPlayers)[game.chapterIdx];

  if(game._lastVoteBreakdown && game._lastVoteApproved === false && client._dismissedVoteBreakdownAt !== game.rejectCount){
    const lastVoteCard = el('div','card');
    lastVoteCard.appendChild(el('h3','গত ভোট'));
    lastVoteCard.appendChild(buildVoteBreakdownList(game._lastVoteBreakdown, game.playersOrder));
    const dismissBtn = el('button','btn btn-outline','বুঝেছি');
    dismissBtn.onclick = ()=>{ client._dismissedVoteBreakdownAt = game.rejectCount; render(); };
    lastVoteCard.appendChild(dismissBtn);
    wrap.appendChild(lastVoteCard);
  }

  card.appendChild(el('h2', `অধ্যায় ${game.chapterIdx+1}: দল মনোনয়ন`));
  card.appendChild(el('p', `সেনাপতি: <strong>${proposer}</strong> — ${teamSize} জনের দল বাছাই করবেন।`));

  const isMyTurn = client.role==='player' && client.myName===proposer;

  if(!isMyTurn){
    card.appendChild(el('div','waiting-box', `<div class="spinner"></div><p>সেনাপতি ${proposer} দল বাছাই করছেন...</p>`));
    wrap.appendChild(card);
    return wrap;
  }

  const selected = client._selectedTeam || [];
  const grid = el('div','chip-grid');
  game.playersOrder.forEach(name=>{
    const chip = el('div','chip'+(selected.includes(name)?' selected':''), name);
    chip.onclick = ()=>{
      if(selected.includes(name)) client._selectedTeam = selected.filter(n=>n!==name);
      else if(selected.length < teamSize) client._selectedTeam = [...selected, name];
      render();
    };
    grid.appendChild(chip);
  });
  card.appendChild(grid);

  const btn = el('button','btn btn-gold', `দল চূড়ান্ত করুন (${selected.length}/${teamSize})`);
  btn.disabled = selected.length !== teamSize;
  btn.onclick = ()=> submitAction(btn, async ()=>{
    const result = await mutateRoom(client.roomCode, (r)=>{
      if(r.game.phase !== 'propose') return r; // already finalized by a racing/duplicate tap -- no-op
      r.game.selectedTeam = selected;
      r.game.votes = {};
      r.game.phase = 'vote';
      return r;
    });
    client._selectedTeam = [];
    return result;
  });
  card.appendChild(btn);
  wrap.appendChild(card);
  return wrap;
};

function buildVoteBreakdownList(breakdown, playersOrder){
  const roster = el('div','roster');
  (playersOrder||Object.keys(breakdown)).forEach(name=>{
    const v = breakdown[name];
    if(!v) return;
    const row = el('div','roster-item');
    row.innerHTML = `<span>${name}</span><span class="tag ${v==='approve'?'nawab':'eic'}">${v==='approve'?'অনুমোদন':'প্রত্যাখ্যান'}</span>`;
    roster.appendChild(row);
  });
  return roster;
}

/* ---------------- VOTE ---------------- */
PHASE.vote = function(room){
  const game = room.game;
  const wrap = el('div');
  const card = el('div','card');
  const teamNames = game.selectedTeam.join(', ');
  card.appendChild(el('h2', `অধ্যায় ${game.chapterIdx+1}: পরিষদের ভোট`));

  const voteCount = Math.min(Object.keys(game.votes||{}).length, room.players.length, game.numPlayers);

  if(client.role==='host'){
    card.appendChild(el('p', `ভোট জমা পড়েছে: ${voteCount}/${game.numPlayers}`));
    const btn = el('button','btn btn-gold','ভোটের ফলাফল প্রকাশ করুন');
    btn.disabled = voteCount !== game.numPlayers;
    btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
        if(r.game.phase !== 'vote') return r; // already revealed by a racing/duplicate tap -- no-op
        const approvals = Object.values(r.game.votes).filter(v=>v==='approve').length;
        const rejections = Object.values(r.game.votes).filter(v=>v==='reject').length;
        const approved = approvals > rejections;
        r.game._lastVoteApproved = approved;
        r.game._lastVoteTally = {approvals, rejections};
        r.game._lastVoteBreakdown = {...r.game.votes};
        if(approved){
          r.game.rejectCount = 0;
          r.game.missionCards = {};
          r.game.phase = 'mission';
        } else {
          r.game.rejectCount += 1;
          if(r.game.rejectCount >= 5){
            r.game.winner = 'eic';
            r.game.phase = 'gameOver';
          } else {
            r.game.proposerIdx = (r.game.proposerIdx+1) % r.game.numPlayers;
            r.game.selectedTeam = [];
            r.game.phase = 'propose';
          }
        }
        return r;
      }));
    card.appendChild(el('p', `প্রস্তাবিত দলঃ ${teamNames}`));
    wrap.appendChild(card);
    return wrap;
  }

  // player
  const myVote = game.votes && game.votes[client.myName];
  if(myVote){
    card.appendChild(el('div','waiting-box', `<div class="spinner"></div><p>আপনার ভোট (${myVote==='approve'?'অনুমোদন':'প্রত্যাখ্যান'}) জমা হয়েছে। বাকিদের জন্য অপেক্ষা করুন। (${voteCount}/${game.numPlayers})</p>`));
  } else {
    const row = el('div','btn-row');
    const approveBtn = el('button','btn btn-nawab','অনুমোদন');
    approveBtn.onclick = ()=> submitAction(approveBtn, ()=> mutateRoom(client.roomCode, (r)=>{
        r.game.votes = r.game.votes || {};
        r.game.votes[client.myName] = 'approve';
        return r;
      }));
    const rejectBtn = el('button','btn btn-eic','প্রত্যাখ্যান');
    rejectBtn.onclick = ()=> submitAction(rejectBtn, ()=> mutateRoom(client.roomCode, (r)=>{
        r.game.votes = r.game.votes || {};
        r.game.votes[client.myName] = 'reject';
        return r;
      }));
    row.appendChild(approveBtn); row.appendChild(rejectBtn);
    card.appendChild(row);
  }
  card.appendChild(el('p', `প্রস্তাবিত দলঃ ${teamNames}`));
  wrap.appendChild(card);
  return wrap;
};

/* ---------------- MISSION ---------------- */
PHASE.mission = function(room){
  const game = room.game;
  const wrap = el('div');
  const card = el('div','card');
  card.appendChild(el('h2', `অধ্যায় ${game.chapterIdx+1} সংঘটিত হচ্ছে`));
  card.appendChild(el('p', `দলঃ ${game.selectedTeam.join(', ')}`));

  const needed = game.selectedTeam.length;
  const playedCount = Math.min(Object.keys(game.missionCards||{}).length, needed);

  if(client.role==='host'){
    card.appendChild(el('p', `কার্ড জমা পড়েছে: ${playedCount}/${needed}`));
    const btn = el('button','btn btn-gold','অধ্যায়ের ফলাফল প্রকাশ করুন');
    btn.disabled = playedCount !== needed;
    btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
        if(r.game.phase !== 'mission') return r; // already revealed by a racing/duplicate tap -- no-op
        const betrayals = Object.values(r.game.missionCards).filter(v=>v==='betray').length;
        const needsTwo = r.game.numPlayers >= 7 && r.game.chapterIdx === 3;
        const outcome = betrayals >= (needsTwo ? 2 : 1) ? 'eic' : 'nawab';
        r.game.chapterResults[r.game.chapterIdx] = outcome;
        r.game._lastBetrayals = betrayals;
        r.game.phase = 'chapterResult';
        return r;
      }));
    card.appendChild(btn);
    wrap.appendChild(card);
    return wrap;
  }

  const onMission = game.selectedTeam.includes(client.myName);
  if(!onMission){
    card.appendChild(el('div','waiting-box', `<div class="spinner"></div><p>এই অধ্যায়ে আপনি নেই। দলের সিদ্ধান্তের অপেক্ষায়... (${playedCount}/${needed})</p>`));
    if(game._lastVoteBreakdown){
      card.appendChild(el('h3','গত ভোট'));
      card.appendChild(buildVoteBreakdownList(game._lastVoteBreakdown, game.playersOrder));
    }
    wrap.appendChild(card);
    return wrap;
  }

  const myCard = game.missionCards && game.missionCards[client.myName];
  const myTeam = game.roles[client.myName].team;

  if(myCard){
    card.appendChild(el('div','waiting-box', `<div class="spinner"></div><p>আপনার কার্ড জমা হয়েছে। ফলাফলের অপেক্ষায়... (${playedCount}/${needed})</p>`));
    wrap.appendChild(card);
    return wrap;
  }

  card.appendChild(el('p','আপনার কার্ড খেলুন।'));
  if(myTeam==='nawab'){
    card.appendChild(el('p','নবাবের প্রতি অনুগত হিসেবে আপনি কেবল "সফল" খেলতে পারেন।'));
    const btn = el('button','btn btn-nawab','সফল খেলুন');
    btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
        r.game.missionCards = r.game.missionCards || {};
        r.game.missionCards[client.myName] = 'success';
        return r;
      }));
    card.appendChild(btn);
  } else {
    card.appendChild(el('p','EIC এজেন্ট হিসেবে সতর্কভাবে বাছাই করুন — বিশ্বাসঘাতকতা প্রকাশ্য নয়, কিন্তু সন্দেহজনক হতে পারে।'));
    const row = el('div','btn-row');
    const s1 = el('button','btn btn-nawab','সফল');
    s1.onclick = ()=> submitAction(s1, ()=> mutateRoom(client.roomCode, (r)=>{
        r.game.missionCards = r.game.missionCards || {};
        r.game.missionCards[client.myName] = 'success';
        return r;
      }));
    const s2 = el('button','btn btn-eic','বিশ্বাসঘাতক');
    s2.onclick = ()=> submitAction(s2, ()=> mutateRoom(client.roomCode, (r)=>{
        r.game.missionCards = r.game.missionCards || {};
        r.game.missionCards[client.myName] = 'betray';
        return r;
      }));
    row.appendChild(s1); row.appendChild(s2);
    card.appendChild(row);
  }
  if(game._lastVoteBreakdown){
    card.appendChild(el('h3','গত ভোট'));
    card.appendChild(buildVoteBreakdownList(game._lastVoteBreakdown, game.playersOrder));
  }
  wrap.appendChild(card);
  return wrap;
};

/* ---------------- CHAPTER RESULT ---------------- */
PHASE.chapterResult = function(room){
  const game = room.game;
  const wrap = el('div');
  const card = el('div','card');
  const outcome = game.chapterResults[game.chapterIdx];
  card.appendChild(el('h2', `অধ্যায় ${game.chapterIdx+1}: ফলাফল`));
  card.appendChild(el('div','result-banner '+outcome, outcome==='nawab' ? 'নবাব পক্ষ এই অধ্যায় জিতেছে' : 'EIC পক্ষ এই অধ্যায় জিতেছে'));

  const wins={nawab:0,eic:0};
  game.chapterResults.forEach(r=>wins[r]++);

  if(client.role!=='host'){
    card.appendChild(el('p','পরবর্তী ধাপের জন্য অপেক্ষা করুন...'));
    wrap.appendChild(card);
    return wrap;
  }

  if(wins.eic >= 3){
    card.appendChild(el('p','EIC পক্ষ ৩টি অধ্যায় জিতে ফেলেছে — খেলা EIC-র জয়ে শেষ।'));
    const btn = el('button','btn btn-gold','চূড়ান্ত ফলাফল দেখুন');
    btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
        if(r.game.phase !== 'chapterResult') return r; // already advanced by a racing/duplicate tap -- no-op
        r.game.winner='eic'; r.game.phase='gameOver'; return r;
      }));
    card.appendChild(btn);
  } else if(wins.nawab >= 3){
    card.appendChild(el('p','নবাব পক্ষ ৩টি অধ্যায় জিতেছে! কিন্তু EIC পক্ষের শেষ সুযোগ বাকি — তারা যদি সঠিকভাবে মীর মদনকে চিহ্নিত করতে পারে, তবে জয় ছিনিয়ে নেবে।'));
    const btn = el('button','btn btn-gold','EIC-র চূড়ান্ত অনুমান পর্বে যান');
    btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
        if(r.game.phase !== 'chapterResult') return r; // already advanced by a racing/duplicate tap -- no-op
        r.game.phase='endgameGuess'; return r;
      }));
    card.appendChild(btn);
  } else if(game.chapterIdx >= 4){
    // shouldn't normally happen (someone should have 3 by chapter 5) but guard anyway
    const winner = wins.nawab>wins.eic ? 'nawab':'eic';
    const btn = el('button','btn btn-gold','চূড়ান্ত ফলাফল দেখুন');
    btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
        if(r.game.phase !== 'chapterResult') return r; // already advanced by a racing/duplicate tap -- no-op
        r.game.winner=winner; r.game.phase='gameOver'; return r;
      }));
    card.appendChild(btn);
  } else {
    const btn = el('button','btn btn-gold', `অধ্যায় ${game.chapterIdx+2}-এ যান`);
    btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
        if(r.game.phase !== 'chapterResult') return r; // already advanced by a racing/duplicate tap -- no-op
        r.game.chapterIdx += 1;
        r.game.proposerIdx = (r.game.proposerIdx+1) % r.game.numPlayers;
        r.game.selectedTeam = [];
        r.game.rejectCount = 0;
        r.game.votes = {};
        r.game.missionCards = {};
        r.game.phase = 'propose';
        return r;
      }));
    card.appendChild(btn);
  }
  wrap.appendChild(card);
  return wrap;
};

/* ---------------- ENDGAME GUESS (EIC identifies Mir Modon) ---------------- */
PHASE.endgameGuess = function(room){
  const game = room.game;
  const wrap = el('div');
  const card = el('div','card');
  card.appendChild(el('h2','EIC-র চূড়ান্ত সুযোগ'));
  card.appendChild(el('p','নবাব পক্ষ ৩টি অধ্যায় জিতেছে। কিন্তু EIC পক্ষ যদি সঠিকভাবে বলতে পারে কে "মীর মদন", তাহলে তারাই জিতবে।'));

  if(game.eicGuess){
    card.appendChild(el('div','waiting-box', `<div class="spinner"></div><p>অনুমান জমা হয়েছে (${game.eicGuess})। ফলাফলের অপেক্ষায়...</p>`));
    if(client.role==='host'){
      const btn = el('button','btn btn-gold','চূড়ান্ত ফলাফল প্রকাশ করুন');
      btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
          if(r.game.phase !== 'endgameGuess') return r; // already revealed by a racing/duplicate tap -- no-op
          const guessedRole = r.game.roles[r.game.eicGuess];
          const correct = guessedRole && guessedRole.roleId === 'mirmodon';
          r.game.winner = correct ? 'eic' : 'nawab';
          r.game.phase = 'gameOver';
          return r;
        }));
      card.appendChild(btn);
    }
    wrap.appendChild(card);
    return wrap;
  }

  const myRole2 = client.role==='player' ? game.roles[client.myName] : null;
  const myTeam = myRole2 ? myRole2.team : null;
  if(client.role==='player' && myTeam==='eic'){
    const isMirJafar = myRole2.roleId==='mirjafar';
    card.appendChild(el('p','আপনার দলের সাথে আলোচনা করে ঠিক করুন কে মীর মদন, তারপর বেছে নিন:'));
    if(!isMirJafar){
      card.appendChild(el('div','note-box','মীরজাফর চূড়ান্ত অনুমান জমা দেবে।'));
    }
    const grid = el('div','chip-grid');
    const chips = [];
    game.playersOrder.forEach(name=>{
      if(game.roles[name].team==='eic') return; // can't guess a fellow EIC agent
      const chip = el('div','chip', name);
      if(isMirJafar){
        chip.onclick = ()=> submitChipAction(chip, chips, ()=> mutateRoom(client.roomCode, (r)=>{
            if(!r.game.eicGuess) r.game.eicGuess = name;
            return r;
          }));
      } else {
        chip.style.pointerEvents = 'none';
        chip.style.opacity = '0.6';
        chip.style.cursor = 'default';
      }
      chips.push(chip);
      grid.appendChild(chip);
    });
    card.appendChild(grid);
  } else {
    card.appendChild(el('div','waiting-box','<div class="spinner"></div><p>EIC পক্ষ সিদ্ধান্ত নিচ্ছে...</p>'));
  }
  wrap.appendChild(card);
  return wrap;
};

/* ---------------- GAME OVER ---------------- */
PHASE.gameOver = function(room){
  const game = room.game;
  const wrap = el('div');
  const card = el('div','card');
  card.appendChild(el('div','result-banner '+game.winner, game.winner==='nawab' ? 'নবাব পক্ষ বিজয়ী' : 'EIC পক্ষ বিজয়ী'));
  if(game.eicGuess){
    const guessedRole = game.roles[game.eicGuess];
    const correct = guessedRole && guessedRole.roleId==='mirmodon';
    card.appendChild(el('p', `EIC-র অনুমান ছিল ${game.eicGuess} — ${correct ? 'সঠিক!' : 'ভুল।'}`));
  }

  card.appendChild(el('h3','লাল দলের সত্য পরিচয়'));
  const eicRoster = el('div','roster');
  game.playersOrder.filter(name=>game.roles[name].team==='eic').forEach(name=>{
    const role = game.roles[name];
    const row = el('div','roster-item');
    row.innerHTML = `<span>${name}</span><span class="tag eic">${role.bn}</span>`;
    eicRoster.appendChild(row);
  });
  card.appendChild(eicRoster);

  card.appendChild(el('h3','সব ভূমিকা প্রকাশ'));
  const roster = el('div','roster');
  game.playersOrder.forEach(name=>{
    const role = game.roles[name];
    const row = el('div','roster-item');
    row.innerHTML = `<span>${name} — <em>${role.bn}</em></span><span class="tag ${role.team}">${role.team==='nawab'?'নবাব':'EIC'}</span>`;
    roster.appendChild(row);
  });
  card.appendChild(roster);

  if(client.role==='host'){
    const btn = el('button','btn btn-gold','নতুন খেলা শুরু করুন (একই কোড)');
    btn.onclick = ()=> submitAction(btn, ()=> mutateRoom(client.roomCode, (r)=>{
        if(r.game.phase !== 'gameOver') return r; // already reset by a racing/duplicate tap -- no-op
        r.game = freshGame(r.game.numPlayers);
        return r;
      }));
    card.appendChild(btn);
  }
  wrap.appendChild(card);
  return wrap;
};

async function boot(){
  const session = loadSession();
  if(session && session.roomCode && session.role){
    const room = await loadRoom(session.roomCode);
    const stillValid = room && (session.role==='host' || (session.myName && room.players.some(p=>p.name===session.myName)));
    if(stillValid){
      client.role = session.role;
      client.roomCode = session.roomCode;
      client.myName = session.myName || null;
      client.room = room;
      startPolling();
      return;
    }
    clearSession();
  }
  render();
}

// Immediate placeholder while boot() checks for a restorable session, so a
// mid-game reload doesn't flash the landing screen before jumping back in.
(function renderBootingPlaceholder(){
  const app = document.getElementById('app');
  const wrap = el('div');
  wrap.appendChild(el('div','title-block', `<div class="eyebrow">Bengal, 1757</div><h1>পলাশী</h1>`));
  const card = el('div','card');
  card.appendChild(el('div','waiting-box','<div class="spinner"></div><p>সেশন পরীক্ষা করা হচ্ছে...</p>'));
  wrap.appendChild(card);
  app.appendChild(wrap);
})();
boot();
</script>
